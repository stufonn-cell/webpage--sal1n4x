# Standalone production file. It is used instead of docker-compose.yml:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the local environment:
#   - The backend is copied into its image (production stage of the Dockerfile).
#   - The frontend is built inside the Nginx image (docker/frontend).
#   - Only backend/storage is mounted as a volume, to keep uploaded files.
#   - MySQL does not publish a port and Adminer is not started.
#   - Nginx listens only on 127.0.0.1: an HTTPS proxy must sit in front of it
#     (it must send X-Forwarded-For and X-Forwarded-Proto; see SECURITY.md).
#   - No container can gain privileges, and logs are capped so a flood of
#     requests cannot fill the disk.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: psiclinic_app
    restart: always
    working_dir: /var/www/html
    # Schema only: demo data is never loaded in production.
    command: ["sh", "-c", "php bin/console migrate && exec php-fpm"]
    volumes:
      - ./backend/storage:/var/www/html/storage
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(extension_loaded('pdo_mysql') ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [psiclinic]

  web:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: psiclinic_web
    restart: always
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on: [app]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/api/session"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [psiclinic]

  mysql:
    image: mysql:8.4
    container_name: psiclinic_mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [psiclinic]

volumes:
  mysql_data:

networks:
  psiclinic:
    driver: bridge
