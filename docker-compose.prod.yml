# Archivo autonomo de produccion. Se usa en lugar de docker-compose.yml:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Diferencias con el entorno local:
#   - El backend se copia en su imagen (etapa production del Dockerfile).
#   - El frontend se compila dentro de la imagen de Nginx (docker/frontend).
#   - Solo backend/storage se monta como volumen, para conservar los adjuntos.
#   - MySQL no publica puerto y Adminer no se levanta.
#   - Nginx escucha solo en 127.0.0.1: delante debe ir un proxy con HTTPS.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: psiclinic_app
    restart: always
    working_dir: /var/www/html
    # Solo el esquema: en produccion no se cargan datos de demostracion.
    command: ["sh", "-c", "php bin/console migrate && exec php-fpm"]
    volumes:
      - ./backend/storage:/var/www/html/storage
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(extension_loaded('pdo_mysql') ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [psiclinic]

  web:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: psiclinic_web
    restart: always
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on: [app]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/api/session"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [psiclinic]

  mysql:
    image: mysql:8.4
    container_name: psiclinic_mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [psiclinic]

volumes:
  mysql_data:

networks:
  psiclinic:
    driver: bridge
