# Entorno local.
#   http://localhost:5173  -> frontend con recarga en caliente (Vite)
#   http://localhost:8080  -> build del frontend servido por Nginx + API
#   http://localhost:8081  -> Adminer

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: psiclinic_app
    restart: unless-stopped
    working_dir: /var/www/html
    # Aplica el esquema (y los datos de demostracion si la base esta vacia)
    # antes de arrancar PHP-FPM. Ambos pasos son idempotentes.
    command: ["sh", "-c", "php bin/console install && exec php-fpm"]
    volumes:
      - ./backend:/var/www/html
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    networks: [psiclinic]

  web:
    image: nginx:1.27-alpine
    container_name: psiclinic_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [psiclinic]

  frontend:
    image: node:20-alpine
    container_name: psiclinic_frontend
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_PROXY: http://web:80
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [web]
    networks: [psiclinic]

  mysql:
    image: mysql:8.4
    container_name: psiclinic_mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 8s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [psiclinic]

  adminer:
    image: adminer:4
    container_name: psiclinic_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    depends_on: [mysql]
    networks: [psiclinic]

volumes:
  mysql_data:
  frontend_node_modules:

networks:
  psiclinic:
    driver: bridge
