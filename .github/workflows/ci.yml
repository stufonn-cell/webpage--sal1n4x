name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (PHP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: psiclinic_test
          MYSQL_USER: psiclinic
          MYSQL_PASSWORD: psiclinic_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, zip
          coverage: none

      - name: Comprobar la sintaxis de todos los archivos PHP
        run: find src public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Preparar el entorno
        run: |
          cp ../.env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=psiclinic_ci/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=psiclinic_test/' .env
          echo "DB_TEST_DATABASE=psiclinic_test" >> .env

      - name: Ejecutar la suite de pruebas
        run: php bin/test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Comprobar tipos
        run: npm run typecheck
      - name: Pruebas
        run: npm test
      - name: Compilar
        run: npm run build

  images:
    name: Construir las imagenes de produccion
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Imagen del backend
        run: docker build -f docker/php/Dockerfile --target production -t psiclinic-app:ci .

      - name: Imagen web (frontend + Nginx)
        run: docker build -f docker/frontend/Dockerfile -t psiclinic-web:ci .
