; PsiClinic - PHP settings (PHP-FPM and CLI)

memory_limit = 256M
max_execution_time = 60
max_input_time = 60
date.timezone = America/Bogota

; Uploads: UPLOAD_MAX_SIZE in .env is 10 MB. post_max_size leaves room for the
; multipart overhead and must match client_max_body_size (11m) in Nginx.
file_uploads = On
upload_max_filesize = 10M
post_max_size = 11M
max_file_uploads = 5
max_input_vars = 1000
max_input_nesting_level = 64

; Errors go to the log (stderr of the container), never to the response.
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
error_reporting = E_ALL
; Stack traces never include argument values (passwords, tokens, clinical text).
zend.exception_ignore_args = On

; Do not reveal the PHP version in a header.
expose_php = Off

; No remote file access through fopen/include; outgoing calls use cURL only.
allow_url_fopen = Off
allow_url_include = Off

; Nothing in PsiClinic runs shell commands.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl

opcache.enable = 1
opcache.memory_consumption = 96
opcache.max_accelerated_files = 8000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Sessions. The application sets the cookie flags as well (src/Core/Session.php):
; HttpOnly, SameSite=Strict, Secure over HTTPS or in production, and the
; idle (SESSION_LIFETIME) and absolute (SESSION_ABSOLUTE_LIFETIME) timeouts.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.sid_length = 48
session.sid_bits_per_character = 6
session.gc_maxlifetime = 7200
