# PsiClinic - Nginx
#   /api/*  -> PHP-FPM (backend/public/index.php)
#   rest    -> compiled SPA (frontend/dist), with index.html as the fallback
#
# This file is included inside the http {} block (conf.d), so the zones and
# maps below live at http level. Check it with `nginx -t` after any change.

# ---------------------------------------------------------------------------
# Request limits per client IP (the real one, see set_real_ip_from below).
# They are the cheap first line that stops floods before they reach PHP-FPM;
# PHP applies its own configurable limits on top (src/Core/RateLimiter.php),
# so these are deliberately a bit looser.
#   psiclinic_api    20 requests/s, bursts of 60       (whole API)
#   psiclinic_login  20 requests/min, bursts of 10     (POST /api/auth/login)
#   psiclinic_conn   30 simultaneous connections per IP
# ---------------------------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=psiclinic_api:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=psiclinic_login:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=psiclinic_conn:10m;

# HSTS only when the visitor reached us over HTTPS (directly or through the
# proxy in front, which sets X-Forwarded-Proto). Browsers ignore it over HTTP.
map "$scheme:$http_x_forwarded_proto" $psiclinic_hsts {
    ~https   "max-age=31536000; includeSubDomains";
    default  "";
}

# The API never renders HTML: it gets the strictest policy. The SPA gets no
# inline scripts or styles and talks only to its own origin.
map $uri $psiclinic_csp {
    ~^/api/  "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'";
    default  "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# Cache: hashed assets forever, index.html always revalidated. API responses
# set their own (no-store) in PHP, so nothing is added for them.
map $uri $psiclinic_cache {
    ~^/assets/   "public, max-age=31536000, immutable";
    /index.html  "no-cache";
    default      "";
}

# The staff app, the patient portal and the API must not end up in search engines.
map $request_uri $psiclinic_robots {
    ~^/(api|app|portal)(/|\?|$)  "noindex, nofollow";
    default                      "";
}

# Retry-After for the 429s Nginx produces itself. When PHP answered 429 it
# already sent its own, more precise value, and nothing is added.
map "$status:$upstream_http_retry_after" $psiclinic_retry_after {
    "429:"   "10";
    default  "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # JSON bodies are small; document uploads get more room below.
    client_max_body_size 2m;
    client_body_buffer_size 128k;

    # Slow clients (slowloris) cannot hold connections open for long.
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn psiclinic_conn 30;

    # Real visitor IP when there is an HTTPS proxy in front. Only private
    # networks are trusted, and the last untrusted IP in the chain is used,
    # which is the one the proxy adds: the client cannot fake it. Without this,
    # the attempt limits would treat every visitor as the same person. If your
    # proxy reaches Nginx from another network, add it here.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Security headers for every response. No location below uses add_header,
    # so all of them inherit this list (Nginx drops inherited headers from any
    # location that declares its own).
    add_header Content-Security-Policy $psiclinic_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), bluetooth=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Strict-Transport-Security $psiclinic_hsts always;
    add_header Cache-Control $psiclinic_cache always;
    add_header X-Robots-Tag $psiclinic_robots always;
    add_header Retry-After $psiclinic_retry_after always;

    # PHP sends some of the same headers (for when it runs without this
    # Nginx); hide them so each header appears once. Never reveal PHP.
    fastcgi_hide_header X-Powered-By;
    fastcgi_hide_header X-Content-Type-Options;
    fastcgi_hide_header X-Frame-Options;
    fastcgi_hide_header Referrer-Policy;
    fastcgi_hide_header Cross-Origin-Resource-Policy;

    # Errors produced by Nginx itself answer in the API's JSON format.
    error_page 413 = @payload_too_large;
    error_page 429 = @too_many_requests;
    error_page 502 503 504 = @api_unavailable;

    location ^~ /api/ {
        limit_req zone=psiclinic_api burst=60 nodelay;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # httpoxy: a client "Proxy:" header must never become HTTP_PROXY.
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        # Sign-in: a much tighter limit on top of the general one.
        location = /api/auth/login {
            limit_req zone=psiclinic_login burst=10 nodelay;
            limit_req zone=psiclinic_api burst=60 nodelay;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass app:9000;
            fastcgi_connect_timeout 5s;
            fastcgi_read_timeout 60s;
        }

        # Document uploads: UPLOAD_MAX_SIZE (10 MB) plus the multipart overhead.
        # Keep it in line with upload_max_filesize/post_max_size in php.ini.
        location = /api/documents {
            client_max_body_size 11m;
            limit_req zone=psiclinic_api burst=60 nodelay;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass app:9000;
            fastcgi_connect_timeout 5s;
            fastcgi_read_timeout 120s;
        }

        # Sending RIPS waits for the Ministry's validator (up to 2 minutes).
        location ~ ^/api/rips/\d+/send$ {
            limit_req zone=psiclinic_api burst=60 nodelay;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass app:9000;
            fastcgi_connect_timeout 5s;
            fastcgi_read_timeout 150s;
        }
    }

    # Hidden files (.env, .git, .htaccess...), except /.well-known/.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Backups, source maps, server code and configuration never belong to the
    # public site. 404 rather than 403: nothing hints that the file exists.
    location ~* \.(?:map|bak|backup|old|orig|save|swp|swo|tmp|dist|sql|sqlite|db|log|ini|conf|env|sh|lock|ya?ml|toml|php\d?|phtml|phar|inc)$ {
        return 404;
    }

    # Files with a hash in their name: they can be cached indefinitely.
    location /assets/ {
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location @too_many_requests {
        default_type application/json;
        return 429 '{"error":{"message":"You are sending requests too quickly. Please wait a few seconds and try again."}}';
    }

    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":{"message":"What you sent is too large. Documents can be up to 10 MB."}}';
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":{"message":"PsiClinic is not available right now. Please try again in a few minutes."}}';
    }
}
